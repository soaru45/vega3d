version: "3.8"
services:
  postgres:
    image: postgres:15-alpine
    container_name: vega_postgres
    environment:
      POSTGRES_USER: vega
      POSTGRES_PASSWORD: vegapassword
      POSTGRES_DB: vegadb
    ports:
      - "5432:5432"
    volumes:
      - vega_pg_data:/var/lib/postgresql/data
    networks:
      - vega_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vega_redis
    ports:
      - "6379:6379"
    volumes:
      - vega_redis_data:/data
    networks:
      - vega_network
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: vega_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - vega_minio_data:/data
    networks:
      - vega_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  vega_pg_data:
  vega_redis_data:
  vega_minio_data:

networks:
  vega_network:
    driver: bridge
